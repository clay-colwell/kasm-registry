name: Build and deploy registry

on:
  push:
    branches-ignore:
      - gh-pages
    paths-ignore:
      - 'workspaces/Forescout Console/console/*.tar.gz'
      - 'workspaces/Forescout Console/desktop/**'
      - 'workspaces/Forescout Console/xfce4/**'
      - 'workspaces/Forescout Console/Background.png'
      - 'workspaces/Forescout Console/Icon.png'
      - 'workspaces/Forescout Console/Dockerfile'
      - 'workspaces/Forescout Console/package_updated_console.sh'
      - 'workspaces/Forescout Console/image-config.json'
      - 'workspaces/Forescout Console/generated/**'
      - 'scripts/generate_forescout_workspaces.py'
      - '.github/workflows/forescout-console-images.yml'
      - '.github/workflows/build-and-deploy.yml'
  workflow_run:
    workflows:
      - Forescout Console images
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: registry-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build # Have to run processing first so the list.json exists to be included in the the deploy
        run: |
          npm ci --prefix processing 
          npm ci --prefix site
          ./build_all_branches.sh

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
