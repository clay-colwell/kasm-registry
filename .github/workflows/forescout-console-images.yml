name: Forescout Console images

on:
  push:
    paths:
      - 'workspaces/Forescout Console/console/*.tar.gz'
      - 'workspaces/Forescout Console/desktop/**'
      - 'workspaces/Forescout Console/xfce4/**'
      - 'workspaces/Forescout Console/Background.png'
      - 'workspaces/Forescout Console/Icon.png'
      - 'workspaces/Forescout Console/Dockerfile'
      - 'workspaces/Forescout Console/package_updated_console.sh'
      - 'workspaces/Forescout Console/image-config.json'
      - 'scripts/generate_forescout_workspaces.py'
      - '.github/workflows/forescout-console-images.yml'
  schedule:
    # GitHub schedules use UTC. 07:00 UTC is 03:00 Eastern during daylight time.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when the base digest is unchanged
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: forescout-console-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate workspace metadata
        run: python3 scripts/generate_forescout_workspaces.py --skip-archive-validation

      - id: matrix
        name: Generate build matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          matrix_args=()
          shared_input_changed=false

          if [[ "$EVENT_NAME" == push ]]; then
            changed_files() {
              if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                git diff --name-only -z "$BEFORE_SHA" "$GITHUB_SHA"
              else
                git diff-tree --root --no-commit-id --name-only -z -r "$GITHUB_SHA"
              fi
            }
            while IFS= read -r -d '' file; do
              case "$file" in
                workspaces/Forescout\ Console/console/*.tar.gz)
                  version=${file##*/}
                  matrix_args+=(--console-version "${version%.tar.gz}")
                  ;;
                workspaces/Forescout\ Console/desktop/*|workspaces/Forescout\ Console/xfce4/*|workspaces/Forescout\ Console/Background.png|workspaces/Forescout\ Console/Icon.png|workspaces/Forescout\ Console/Dockerfile|workspaces/Forescout\ Console/package_updated_console.sh|workspaces/Forescout\ Console/image-config.json|scripts/generate_forescout_workspaces.py|.github/workflows/forescout-console-images.yml)
                  shared_input_changed=true
                  ;;
              esac
            done < <(changed_files)
          fi

          if [[ "$shared_input_changed" == true ]]; then
            matrix_args=()
          fi

          matrix=$(python3 scripts/generate_forescout_workspaces.py --matrix --skip-archive-validation "${matrix_args[@]}")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and validate selected Console archive
        env:
          CONSOLE_ARCHIVE: ${{ matrix.console_archive }}
          CONSOLE_VERSION: ${{ matrix.console_version }}
        run: |
          git lfs pull --include="workspaces/Forescout Console/console/$CONSOLE_ARCHIVE" --exclude=""
          python3 scripts/generate_forescout_workspaces.py --matrix --console-version "$CONSOLE_VERSION" > /dev/null

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if echo "$GHCR_TOKEN" | timeout 90 docker login ghcr.io --username "$GHCR_USER" --password-stdin; then
              exit 0
            fi
            echo "GHCR login attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 10))
          done
          exit 1

      - id: digest
        name: Compare upstream base digest
        env:
          BASE_IMAGE: ${{ matrix.base_image }}
          TARGET_IMAGE: ${{ matrix.image }}:${{ matrix.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base_digest=$(docker buildx imagetools inspect "$BASE_IMAGE" --format '{{.Manifest.Digest}}')
          published_digest=$(docker buildx imagetools inspect "$TARGET_IMAGE" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.base.digest"}}' 2>/dev/null || true)
          echo "base_digest=$base_digest" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == push || "$FORCE_REBUILD" == true || "$base_digest" != "$published_digest" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        if: steps.digest.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workspaces/Forescout Console/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}:${{ matrix.tag }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BASE_DIGEST=${{ steps.digest.outputs.base_digest }}
            CONSOLE_ARCHIVE=${{ matrix.console_archive }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.console_version }}-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.console_version }}-${{ matrix.tag }}

      - name: Estimate uncompressed image size
        env:
          TARGET_IMAGE: ${{ matrix.image }}:${{ matrix.tag }}
          WORKSPACE_FILE: workspaces/Forescout Console/generated/${{ matrix.console_version }}/workspace.json
          IMAGE_CHANGED: ${{ steps.digest.outputs.changed }}
          CONSOLE_VERSION: ${{ matrix.console_version }}
          KASM_VERSION: ${{ matrix.kasm_version }}
        run: |
          existing_size=$(jq --arg image "$TARGET_IMAGE" \
            '[.compatibility[]? | select(.image == $image) | .uncompressed_size_mb][0] // 0' \
            "$WORKSPACE_FILE" 2>/dev/null || echo 0)
          if [[ "$IMAGE_CHANGED" == true || "$existing_size" == 0 ]]; then
            console_size=$(python3 scripts/generate_forescout_workspaces.py --archive-size-mb "$CONSOLE_VERSION")
            overhead=$(jq --arg version "$KASM_VERSION" \
              '[.kasm_versions[] | select(.version == $version) | .estimated_overhead_mb][0]' \
              'workspaces/Forescout Console/image-config.json')
            size_mb=$((console_size + overhead))
          else
            size_mb=$existing_size
          fi
          mkdir -p image-size
          jq -n --arg image "$TARGET_IMAGE" --argjson size "$size_mb" \
            '{image: $image, uncompressed_size_mb: $size}' \
            > "image-size/${{ matrix.console_version }}-${{ matrix.kasm_version }}.json"

      - name: Upload image-size estimate
        uses: actions/upload-artifact@v4
        with:
          name: image-size-${{ matrix.console_version }}-${{ matrix.kasm_version }}
          path: image-size/*.json
          retention-days: 1

  publish-metadata:
    needs:
      - prepare
      - build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download image-size records
        uses: actions/download-artifact@v4
        with:
          pattern: image-size-*
          path: image-sizes
          merge-multiple: true

      - name: Generate workspaces and apply published image sizes
        run: |
          python3 scripts/generate_forescout_workspaces.py --skip-archive-validation
          python3 scripts/generate_forescout_workspaces.py --sizes-dir image-sizes

      - name: Commit generated registry workspaces
        run: |
          if [[ -n "$(git status --short -- 'workspaces/Forescout Console/generated')" ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add 'workspaces/Forescout Console/generated'
            git commit -m 'chore: update Forescout workspace metadata'
            git push
          fi
